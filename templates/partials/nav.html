{% set base = '' if request.endpoint == 'index' else url_for('index') %}
<header class="site-header" data-header>
  <div class="site-header__inner wrap">
    <a class="wordmark" href="{{ url_for('index') }}" aria-label="{{ product.name }} {{ product.edition }}, home">
      <span class="wordmark__name">AI Toolkit</span><span class="wordmark__ed" aria-hidden="true">{{ product.edition }}</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        <li><a href="{{ base }}#toolkit">Toolkit</a></li>
        <li><a href="{{ base }}#inside">What’s inside</a></li>
        <li><a href="{{ base }}#bonus">Bonus</a></li>
        <li><a href="{{ base }}#who">Who it’s for</a></li>
        <li><a href="{{ base }}#faq">FAQ</a></li>
      </ul>
      <a class="btn btn--primary site-nav__cta-mobile" href="{{ checkout_url }}" rel="noopener">Get the toolkit</a>
    </nav>

    <a class="btn btn--outline btn--sm site-header__cta" href="{{ checkout_url }}" rel="noopener">Get the toolkit</a>

    <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" data-menu-toggle>
      <span class="visually-hidden">Menu</span>
      <span class="menu-toggle__bar" aria-hidden="true"></span>
      <span class="menu-toggle__bar" aria-hidden="true"></span>
    </button>
  </div>
</header>
