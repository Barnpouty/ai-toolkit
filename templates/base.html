<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Toolkit 2026 — The AI Starter Kit for Students & Young Professionals{% endblock %}</title>
  <script>document.documentElement.classList.add('js')</script>
  <meta name="description" content="{% block description %}Two practical PDF guides to the AI tools students and young professionals actually use in 2026 — what each tool is for, when the free version is enough, and how to use AI responsibly.{% endblock %}">
  <link rel="canonical" href="{{ site_url }}{{ request.path }}">
  {% block robots %}<meta name="robots" content="index, follow">{% endblock %}
  <meta name="theme-color" content="#16171a">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ product.name }}">
  <meta property="og:title" content="{{ self.title() | trim }}">
  <meta property="og:description" content="{{ self.description() | trim }}">
  <meta property="og:url" content="{{ site_url }}{{ request.path }}">
  <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='images/og-image.jpg') }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ asset('css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "partials/nav.html" %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  <script src="{{ asset('js/main.js') }}" defer></script>
</body>
</html>
